spring:
  application:
    name: plan-things-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=plan_things_db;encrypt=false;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          time_zone: UTC
        format_sql: true
  jackson:
    locale: pt_BR
    time-zone: America/Sao_Paulo
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-local-jwt-secret-change-me-00000000000000000000000000000000}
    issuer: plan-things-api
    access-token-minutes: 180
    password-reset-minutes: 30
  time:
    zone-id: America/Sao_Paulo
  oauth:
    frontend-callback-url: ${APP_OAUTH_FRONTEND_CALLBACK_URL:http://localhost:5173/oauth/callback}
    web-callback-url: ${APP_OAUTH_WEB_CALLBACK_URL:${APP_OAUTH_FRONTEND_CALLBACK_URL:http://localhost:5173/oauth/callback}}
    mobile-callback-url: ${APP_OAUTH_MOBILE_CALLBACK_URL:planthings://oauth/callback}
    mobile-web-callback-url: ${APP_OAUTH_MOBILE_WEB_CALLBACK_URL:}
    state-minutes: ${APP_OAUTH_STATE_MINUTES:10}
    completion-code-minutes: ${APP_OAUTH_COMPLETION_CODE_MINUTES:5}
    allowed-redirect-paths:
      - /
      - /app
      - /workspace
      - /calendar
      - /files
      - /settings
      - /plans/invites
    providers:
      google:
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
        authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
        token-uri: https://oauth2.googleapis.com/token
        redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/oauth/google/callback}
        issuer: https://accounts.google.com
        jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
        scopes:
          - openid
          - profile
          - email
      microsoft:
        client-id: ${MICROSOFT_OAUTH_CLIENT_ID:}
        client-secret: ${MICROSOFT_OAUTH_CLIENT_SECRET:}
        authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
        token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
        redirect-uri: ${MICROSOFT_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/oauth/microsoft/callback}
        issuer: https://login.microsoftonline.com/common/v2.0
        jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
        scopes:
          - openid
          - profile
          - email
  intelligence:
    enabled: ${INTELLIGENCE_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${INTELLIGENCE_MODEL:gpt-5.4-mini}
    reasoning-effort: ${INTELLIGENCE_REASONING_EFFORT:low}
    max-output-tokens: ${INTELLIGENCE_MAX_OUTPUT_TOKENS:6000}
    use-openai-conversations: ${INTELLIGENCE_USE_OPENAI_CONVERSATIONS:false}
    store-openai-responses: ${INTELLIGENCE_STORE_OPENAI_RESPONSES:false}
    compact-threshold: ${INTELLIGENCE_COMPACT_THRESHOLD:120000}
  docs:
    embeds:
      unsplash:
        access-key: ${UNSPLASH_ACCESS_KEY:}
      youtube:
        api-key: ${YOUTUBE_API_KEY:}
  integrations:
    token-key-base64: ${APP_INTEGRATION_TOKEN_KEY_B64:}
    gmail:
      redirect-uri: ${GMAIL_INTEGRATION_REDIRECT_URI:http://localhost:8080/api/settings/integrations/gmail/callback}
      frontend-return-url: ${GMAIL_INTEGRATION_FRONTEND_RETURN_URL:http://localhost:5173/settings}
      web-return-url: ${GMAIL_INTEGRATION_WEB_RETURN_URL:${GMAIL_INTEGRATION_FRONTEND_RETURN_URL:http://localhost:5173/settings}}
      mobile-return-url: ${GMAIL_INTEGRATION_MOBILE_RETURN_URL:planthings://settings}
      mobile-web-return-url: ${GMAIL_INTEGRATION_MOBILE_WEB_RETURN_URL:}
      state-minutes: ${GMAIL_INTEGRATION_STATE_MINUTES:10}
      scopes:
        - openid
        - profile
        - email
        - https://www.googleapis.com/auth/gmail.send
    github:
      client-id: ${GITHUB_INTEGRATION_CLIENT_ID:}
      client-secret: ${GITHUB_INTEGRATION_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_INTEGRATION_REDIRECT_URI:http://localhost:8080/api/settings/integrations/github/callback}
      frontend-return-url: ${GITHUB_INTEGRATION_FRONTEND_RETURN_URL:http://localhost:5173/settings}
      web-return-url: ${GITHUB_INTEGRATION_WEB_RETURN_URL:${GITHUB_INTEGRATION_FRONTEND_RETURN_URL:http://localhost:5173/settings}}
      mobile-return-url: ${GITHUB_INTEGRATION_MOBILE_RETURN_URL:planthings://settings}
      mobile-web-return-url: ${GITHUB_INTEGRATION_MOBILE_WEB_RETURN_URL:}
      state-minutes: ${GITHUB_INTEGRATION_STATE_MINUTES:10}
      polling-interval-ms: ${GITHUB_INTEGRATION_POLLING_INTERVAL_MS:300000}
      polling-batch-size: ${GITHUB_INTEGRATION_POLLING_BATCH_SIZE:50}
      api-version: ${GITHUB_INTEGRATION_API_VERSION:2022-11-28}
      user-agent: ${GITHUB_INTEGRATION_USER_AGENT:PlanThings-API}
      scopes:
        - repo
