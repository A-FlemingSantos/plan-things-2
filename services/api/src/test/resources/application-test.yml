spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=plan_things_test;encrypt=false;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  frontend-base-url: http://localhost:5173
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-test-jwt-secret-change-me-00000000000000000000000000000000}
    issuer: plan-things-api-test
    access-token-minutes: 180
    password-reset-minutes: 30
  integrations:
    token-key-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
