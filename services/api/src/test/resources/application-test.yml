spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=plan_things_test;encrypt=false;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  frontend-base-url: http://localhost:5173
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-test-jwt-secret-change-me-00000000000000000000000000000000}
    issuer: plan-things-api-test
    access-token-minutes: 180
    password-reset-minutes: 30
  intelligence:
    enabled: false
    api-key: test-openai-key
    model: gpt-5.4-mini
    reasoning-effort: low
    max-output-tokens: 6000
    use-openai-conversations: false
    store-openai-responses: false
    compact-threshold: 120000
  integrations:
    token-key-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    github:
      client-id: test-github-client
      client-secret: test-github-secret
      redirect-uri: http://localhost/api/settings/integrations/github/callback
      frontend-return-url: http://localhost/settings
      polling-interval-ms: 60000
      polling-batch-size: 10
      scopes:
        - repo
